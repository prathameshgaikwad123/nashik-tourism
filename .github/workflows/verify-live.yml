name: Verify live site
# Post-deploy check against the live site: pages 200, every redirect 301 -> 200, crawler files, IndexNow key.
on:
  workflow_dispatch:
  push:
    branches: [claude/beautiful-lamport-svz84x]
    paths: ["tools/verify-live.py", ".github/workflows/verify-live.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/verify-live.py

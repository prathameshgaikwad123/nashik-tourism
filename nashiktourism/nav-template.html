<!--
  ══════════════════════════════════════════════════════════════════════════
  DEVELOPER REFERENCE ONLY — not a public page.

  This file is marked noindex so search engines drop it. It stays crawlable
  on purpose: a robots.txt Disallow would stop crawlers reading the noindex.

  SOURCE OF TRUTH
  ---------------
  As of Phase 3 there is exactly one definition of the site chrome:

      tools/chrome.py   (nav_html(), footer_html(), SITE_JS, GA)

  Every page's <header> and <footer> is rewritten from it. Change the chrome
  there, then re-run the full build:

      python3 tools/build-destinations.py   # /discover-nashik/*, /plan-your-trip/
      python3 tools/build-blog.py           # /blog/ index
      python3 tools/apply-chrome.py         # header/footer on every page
      python3 tools/build-home-guides.py    # homepage guide cards
      python3 tools/build-sitemap.py        # sitemap.xml

  Shared page behaviour lives in /site.js — one deferred, cached file. Do not
  paste nav JavaScript back into a page; apply-chrome.py deletes inline blocks
  it can prove are chrome-only, and keeps any it cannot (see SAFE_TOKENS).

  The markup below is the historical Phase 1 reference. tools/chrome.py is
  authoritative; this file is documentation only.

  ACCESSIBILITY CONTRACT — do not drop these when copying:
    * <a class="skip-link" href="#main"> as the first element in <body>
    * <header>, <nav aria-label="Primary">, <main id="main">, <footer>
    * dropdowns need the separate .chevron-btn toggle carrying
      aria-expanded + aria-controls. Hover alone is not keyboard accessible.
    * the hamburger needs aria-expanded + aria-controls="mobileMenu"
    * "Independent Travel Guide" under the logo — never "Official". This site
      is not a government or official tourism body.
  ══════════════════════════════════════════════════════════════════════════
